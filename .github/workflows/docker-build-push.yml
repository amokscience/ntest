name: Build and Push Docker Image

on:
  push:
    branches: [ dev, qa, staging, prod ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate short SHA
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ntest:${{ github.ref_name }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ntest:${{ github.ref_name }}-${{ steps.short_sha.outputs.sha }}

      - name: Update GitOps repo with new image tag
        run: |
          git clone https://github.com/amokscience/argo-apps.git
          cd argo-apps
          
          # Get short SHA
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          
          # Determine which values file to update based on branch
          case "${{ github.ref_name }}" in
            dev)
              VALUES_FILE="ntest/helm/values-dev.yaml"
              TAG_PREFIX="dev"
              ;;
            qa)
              VALUES_FILE="ntest/helm/values-qa.yaml"
              TAG_PREFIX="qa"
              ;;
            staging)
              VALUES_FILE="ntest/helm/values-staging.yaml"
              TAG_PREFIX="staging"
              ;;
            prod)
              VALUES_FILE="ntest/helm/values-prod.yaml"
              TAG_PREFIX="prod"
              ;;
          esac
          
          # Update values file with new image tag
          sed -i "s/tag: \"${TAG_PREFIX}-.*/tag: \"${TAG_PREFIX}-${SHORT_SHA}\"/" $VALUES_FILE
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit and push
          git config user.email "bot@example.com"
          git config user.name "GitHub Actions Bot"
          git add $VALUES_FILE
          git commit -m "Update ${TAG_PREFIX} image tag to ${TAG_PREFIX}-${SHORT_SHA}"
          git remote set-url origin https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/amokscience/argo-apps.git
          git push origin HEAD:main

  promote:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Promote dev to qa
        if: github.ref == 'refs/heads/dev'
        run: |
          git fetch origin
          git checkout qa
          git merge origin/dev --no-ff -m "Auto-promote from dev after successful build"
          git push origin qa
        continue-on-error: true

      - name: Promote qa to staging
        if: github.ref == 'refs/heads/qa'
        run: |
          git fetch origin
          git checkout staging
          git merge origin/qa --no-ff -m "Auto-promote from qa after successful build"
          git push origin staging
        continue-on-error: true

      - name: Promote staging to prod
        if: github.ref == 'refs/heads/staging'
        run: |
          git fetch origin
          git checkout prod
          git merge origin/staging --no-ff -m "Auto-promote from staging after successful build"
          git push origin prod
        continue-on-error: true
